<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EDH Collection{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://unpkg.com/marked@12.0.0/marked.min.js" defer></script>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">⚔ EDH Collection</a>
    <div class="nav-links">
      <a href="/">Decks</a>
      <a href="/recommend">What to Build</a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <span>Powered by Archidekt · Scryfall · {% if ai_provider == 'gemini' %}Gemini{% elif ai_provider == 'claude' %}Claude{% else %}No AI configured{% endif %}</span>
  </footer>
</body>
</html>
