services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Deck data persists on your machine outside the container
      - ./decks:/app/decks
    env_file:
      - .env
    environment:
      - DECKS_DIR=/app/decks
    # Hot-reload in dev — remove for production
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # Run the importer as a one-off job:
  #   docker compose run --rm importer
  importer:
    build: .
    volumes:
      - ./decks:/app/decks
    env_file:
      - .env
    environment:
      - DECKS_DIR=/app/decks
    command: >
      python3 scripts/import_archidekt.py
      --username ${ARCHIDEKT_USERNAME}
    profiles:
      - tools
